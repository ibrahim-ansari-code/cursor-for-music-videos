version: v2
name: brikli-frontend-prod

# ---------- Build settings ----------
# This section tells Porter how to build your frontend.
build:
  method: docker
  context: ./Frontend
  dockerfile: ./Frontend/Dockerfile

  # This is the critical part: It passes variables from your Porter
  # Environment Group into the Docker build process. Vite needs these
  # to bake them into the final static files.
  args:
    VITE_API_URL:            ${VITE_API_URL}
    VITE_SUPABASE_URL:       ${VITE_SUPABASE_URL}
    VITE_SUPABASE_ANON_KEY:  ${VITE_SUPABASE_ANON_KEY}
    VITE_SITE_URL:           ${VITE_SITE_URL}
    VITE_AZURE_MAPS_KEY:     ${VITE_AZURE_MAPS_KEY}

# ---------- Runtime service ----------
# This section describes how your frontend service runs after being built.
services:
  - name: brikli-frontend
    type: web
    run: "" # Nginx starts automatically, so no run command is needed.
    port: 4173
    cpuCores: 0.16
    ramMegabytes: 500
    instances: 1
    domains:
      - name: app.brikli.com

# ---------- Environment ----------
# This links the same environment group you're already using.
envGroups:
  - brikli-frontend-prod

autoRollback:
  enabled: false 