[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "brikli-backend"
version = "0.1.0"
description = "Brikli Backend API"
authors = [
    {name = "Zubin", email = "zubin.singh@brikli.com"},
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "asyncpg>=0.30.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.12",
    "flask>=3.1.0",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=23.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.8.1",
    "pydantic>=2.11.1",
    "python-jose>=3.4.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[mypy]>=2.0.40",
    "sqlmodel>=0.0.24",
    "psycopg[binary,pool]>=3.2.6",
    "python-dotenv>=1.1.0,<2.0.0",
    "alembic>=1.15.2,<2.0.0",
    "bcrypt<4.1.0",
    "openai>=1.12.0",
    "sendgrid>=6.11.0,<7.0.0",
    "azure-communication-sms>=1.1.0,<2.0.0",
    "PyMuPDF>=1.23.0",
    "property>=2.6.2,<3.0.0",
    "azure-storage-blob>=12.25.1,<13.0.0",
    "aiofiles>=24.1.0,<25.0.0",
    "aiohttp>=3.11.16,<4.0.0",
    "python-dateutil>=2.9.0.post0,<3.0.0",
    "uvicorn[standard]>=0.23.0",
    "starlette>=0.46.2,<0.47.0",
    "supabase>=2.15.1",
    "apideck-unify>=0.17.2,<0.18.0",
    "cachetools>=5.3.0,<6.0.0",
    "regex>=2024.11.6,<2025.0.0",
    "greenlet>=3.2.3,<4.0.0",
    "azure-ai-projects (>=1.0.0b11,<2.0.0)",
    "azure-identity (>=1.23.0,<2.0.0)",
    "azure-core (>=1.34.0,<2.0.0)",
    "pgvector (>=0.4.1,<0.5.0)",
    "sentry-sdk[fastapi] (>=2.37.1,<3.0.0)",
]


[tool.mypy]
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.poetry]
# Poetry-specific configuration
package-mode = false

[tool.poetry.scripts]
# Note: Scripts run from Backend/ directory with proper Python path
# Run from project root: cd Backend && poetry run serve

[tool.poetry.group.test.dependencies]
pytest = "^8.4.1"
pytest-asyncio = "^1.1.0"
pytest-cov = "^6.2.1"
pytest-json-report = "^1.5.0"
pytest-metadata = "^3.1.1"
pytest-mock = "^3.14.1"
pytest-xdist = "^3.8.0"
httpx = "^0.28.1"
mypy = "^1.11.0"
diff-cover = "^9.0.0"

[tool.coverage.run]
source = ["Backend"]
omit = [
    # Exclude unimplemented services
    "Backend/llm/embedding_service.py",
    "Backend/models/document_chunks.py",
    
    # Exclude migration files
    "Backend/migrations/*",
    
    # Exclude config and test files
    "Backend/tests/*",
    "Backend/config.py",
    "Backend/database.py",
    
    # Exclude __init__ files
    "Backend/**/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    # Standard exclusions
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == '__main__':",
    
    # Exclude defensive programming
    "except ImportError:",
    "except Exception as e:",
    "logger.error",
    "logger.warning",
]