[pytest]
# Test discovery
testpaths = Backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support - EXPLICIT configuration to fix deprecation warning
asyncio_mode = auto

# Test markers
markers = 
    auth: marks tests that require authentication
    slow: marks tests as slow  
    integration: marks tests as integration tests
    unit: marks tests as unit tests

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Output configuration
# Sequential execution (parallel execution disabled)
addopts = -v --tb=short --strict-markers --durations=10 --maxfail=5
# -n auto: Parallel execution with optimal worker count (based on CPU cores)
# --durations=10: Show 10 slowest tests for optimization
# --maxfail=5: Stop after 5 failures to avoid wasting time on broken test runs
# Distribution modes can be set with --dist flag:
# --dist each: Send each test to any available worker (default)
# --dist loadscope: Send tests grouped by module to same worker
# --dist loadfile: Send all tests in a file to same worker
# --dist loadgroup: Send tests marked with same group to same worker

# Minimum Python version
minversion = 3.11 