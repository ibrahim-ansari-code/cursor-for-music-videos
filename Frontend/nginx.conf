server {
  listen 80;

  # Enable gzip compression with optimized settings
  gzip on;
  gzip_comp_level 6;
  gzip_proxied any;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/xml+rss
    application/json
    application/xml
    image/svg+xml
    font/woff
    font/woff2;

  # Serve React App
  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  # Static assets with long-term caching
  location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff|woff2|ttf|eot|otf)$ {
    root   /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Proxy API requests to the backend.
  # For this to work in your Vite app, you should make API requests to relative paths like `/api/users`.
  # The VITE_API_URL should be set to an empty string or `/` during the build.
  location /api/ {
    # This URL works with docker-compose. In Kubernetes, you will replace 'backend:8000'
    # with the name of your backend service, e.g., 'http://brikli-backend-service:8000/'.
    proxy_pass http://backend:8000/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # redirect server error pages to the static page /50x.html
  error_page   500 502 503 504  /50x.html;
  location = /50x.html {
    root   /usr/share/nginx/html;
  }
} 