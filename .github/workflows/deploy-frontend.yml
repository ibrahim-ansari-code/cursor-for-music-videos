name: Deploy Frontend # Renamed for clarity?

on:
  push:
    branches:
      - main # Deploy from main branch for production
#  pull_request:
#    types: [opened, synchronize, reopened, closed]
#    branches:
#      - main

jobs:
  build_and_deploy_job:
    # if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
# Removed obsolete OIDC steps
#      - name: Install OIDC Client from Core Package
#        run: npm install @actions/core@1.6.0 @actions/http-client
#      - name: Get Id Token
#        uses: actions/github-script@v6
#        id: idtoken
#        with:
#           script: |
#               const coredemo = require('@actions/core')
#               return await coredemo.getIDToken()
#           result-encoding: string

      # Step to log in to Azure using OIDC
      - name: Log in to Azure
        id: login # Changed step id for clarity
        uses: Azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }} # Assuming same secrets used for prod
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Use OIDC, token can be empty
          azure_static_web_apps_api_token: "" 
          action: "upload"
          ###### Repository/Build Configurations - Use correct paths ######
          app_location: "./Frontend" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "build" # Built app content directory - assuming standard React build
          # Removed github_id_token as Azure/login is used
          skip_app_build: true # Assuming build happens elsewhere or via Oryx
          skip_api_build: true # Assuming no API
          ###### End of Repository/Build Configurations ######

