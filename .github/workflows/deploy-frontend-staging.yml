name: Deploy Brikli Frontend (Staging)

on:
  push:
    branches:
      - staging
#  pull_request: # Keep disabled for now unless PR previews are needed for staging
#    types: [opened, synchronize, reopened, closed]
#    branches:
#      - staging

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Build and Deploy Staging Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
# Removed obsolete OIDC client install steps - Azure/login handles this
#      - name: Install OIDC Client from Core Package
#        run: npm install @actions/core@1.6.0 @actions/http-client
#      - name: Get Id Token
#        uses: actions/github-script@v6
#        id: idtoken
#        with:
#          script: |
#            const coredemo = require('@actions/core')
#            return await coredemo.getIDToken()
#          result-encoding: string

# Removed frontend build step - should be handled by SWA deploy action or separate build job
#      - name: Install dependencies including devDependencies
#        run: npm ci
#        working-directory: Frontend

      # Deploy Step - Uses default GitHub token auth for SWA
      - name: Build And Deploy Staging
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Explicitly set the deployment token secret for staging
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_STAGING }}
          action: "upload"
          # Set production_branch if needed for your SWA config, otherwise remove
          # production_branch: "main"
          # Correct locations
          app_location: "./Frontend" # App source code path
          api_location: "" # No API
          output_location: "build" # Built app content directory
          # Add explicit build command
          app_build_command: "npx vite build"
          # Let Oryx handle the build within the SWA deploy action
          # skip_app_build: true # Remove this to allow Oryx build

