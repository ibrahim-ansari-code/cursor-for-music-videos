name: Deploy Brikli Frontend (Staging)

on:
  push:
    branches:
      - staging

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build and Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_STAGING }}
          action: "upload"
          app_location: "/"
          output_location: "Frontend/dist"
          app_build_command: cd Frontend && VITE_API_URL='https://icy-glacier-00294140f.6.azurestaticapps.net' npm run build
