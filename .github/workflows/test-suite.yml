name: Test Suite

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Need to set these test environment variables for the api tests to run
env:
  DATABASE_URL: "postgresql://test:test@localhost:5432/test_db"
  SECRET_KEY: "test-secret-key-for-ci"
  APIDECK_API_KEY: "test-key"
  APIDECK_APP_ID: "test-app-id"
  SUPABASE_WEBHOOK_SECRET: "test-webhook-secret"
  SUPABASE_URL: "https://test.supabase.co"
  SUPABASE_ANON_KEY: "test-anon-key"
  SUPABASE_SERVICE_KEY: "test-service-key"
  API_BASE_URL: "http://localhost:8000"
  TESTING: "true"

jobs:
  backend-tests:
    name: "Backend Tests (Unit → API → Coverage)"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for diff coverage
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            Backend/.venv
          key: poetry-${{ runner.os }}-${{ hashFiles('Backend/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-
      
      - name: Install dependencies
        run: |
          cd Backend
          poetry install --with test --no-root
      
      # STEP 1: Run Unit Tests (must pass to continue)
      - name: "Step 1: Run Unit Tests with Coverage (100% Required)"
        run: |
          cd Backend
          poetry run pytest tests/unit_tests/ \
            -v \
            --tb=short \
            -n auto \
            --cov=Backend \
            --cov-branch \
            --cov-report=term-missing \
            --junit-xml=tests/unit-test-results.xml
      
      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: Backend/tests/unit-test-results.xml
      
      # STEP 2: Run API Tests (only if unit tests passed)
      - name: "Step 2: Create Mock Test Credentials"
        run: |
          cd Backend/tests
          # Create a minimal test credentials file for CI environment
          echo '{
            "SUPABASE_URL": "https://test.supabase.co",
            "SUPABASE_ANON_KEY": "test-anon-key",
            "SUPABASE_SERVICE_KEY": "test-service-key",
            "TEST_USER_EMAIL": "test@example.com",
            "TEST_USER_PASSWORD": "test-password"
          }' > .test_credentials.json
      
      - name: "Step 2: Start Test Server for API Tests"
        run: |
          cd Backend
          # Start server in background and save PID
          poetry run uvicorn api.app:app --host 127.0.0.1 --port 8000 &
          echo $! > server.pid

          # Wait for server to be ready with proper health check polling
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -f http://localhost:8000/api/health 2>/dev/null; then
              echo "✅ Server is ready after ${i} attempts!"
              break
            fi
            echo "⏳ Waiting for server... (attempt $i/30)"
            sleep 2
          done

          # Final verification
          curl -f http://localhost:8000/api/health || (echo "❌ Server failed to start" && exit 1)
      
      - name: "Step 2: Run API Tests with Coverage (100% Required)"
        run: |
          cd Backend
          poetry run pytest tests/api_tests/ \
            -v \
            --tb=short \
            -n auto \
            --cov=Backend \
            --cov-branch \
            --cov-append \
            --cov-report=term-missing \
            --junit-xml=tests/api-test-results.xml
      
      - name: "Step 2: Stop Test Server"
        if: always()
        run: |
          if [ -f Backend/server.pid ]; then
            kill $(cat Backend/server.pid) || true
            rm Backend/server.pid
          fi
      
      - name: Upload API test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: Backend/tests/api-test-results.xml
      
      # STEP 3: Generate Coverage Reports (using existing coverage data)
      - name: "Step 3: Generate Coverage Reports"
        run: |
          cd Backend
          # Generate XML and HTML coverage reports from collected data
          poetry run coverage xml -o tests/coverage.xml
          poetry run coverage html -d tests/htmlcov
          poetry run coverage report
      
      - name: "Step 3: Check Diff Coverage (70%+ on New Code)"
        run: |
          cd Backend
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            poetry run diff-cover tests/coverage.xml \
              --compare-branch=origin/${{ github.base_ref }} \
              --fail-under=70 \
              --diff-range-notation='..'
          else
            echo "Skipping diff coverage check for push events"
          fi
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            Backend/tests/coverage.xml
            Backend/tests/htmlcov/
  
  tenant-frontend-tests:
    name: "Frontend Tests (Tenant Portal)"
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./Tenant-Frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: Tenant-Frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
        continue-on-error: false
      
      - name: Run Tests
        run: npm run test:run
      
      - name: Generate Test Coverage
        run: npm run test:coverage
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tenant-frontend-test-results
          path: |
            Tenant-Frontend/coverage/
            Tenant-Frontend/test-results.xml
      
      - name: Build Frontend
        run: npm run build

  landlord-frontend-tests:
    name: "Frontend Tests (Landlord Portal)"
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./Frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Build
        run: npm run build
        env:
          CI: true
      
      - name: Verify Build Chunks
        run: |
          echo "Checking build output for proper code splitting..."
          ls -la dist/assets/
          
          # With lazy loading strategy, check for route-based chunks
          if ! ls dist/assets/Leases-*.js 2>/dev/null; then
            echo "ERROR: Leases route chunk not found!"
            exit 1
          fi
          
          if ! ls dist/assets/Properties-*.js 2>/dev/null; then
            echo "ERROR: Properties route chunk not found!"
            exit 1
          fi
          
          if ! ls dist/assets/Tenants-*.js 2>/dev/null; then
            echo "ERROR: Tenants route chunk not found!"
            exit 1
          fi
          
          # Check main index bundle exists
          if ! ls dist/assets/index-*.js 2>/dev/null; then
            echo "ERROR: Main index bundle not found!"
            exit 1
          fi
          
          echo "✅ All route-based chunks generated successfully with lazy loading"
      
      - name: Run Tests
        run: npm test -- --run
        env:
          CI: true
      
      - name: Run Chunking Validation Tests
        run: npm test -- --run tests/config/vite-chunking.test.ts
      
      - name: Run Build Verification Tests
        run: npm test -- --run tests/config/build-verification.test.ts
      
      - name: Check for Security Issues
        run: |
          echo "Checking for global React exposure..."
          if grep -r "window.React\s*=" dist/ 2>/dev/null; then
            echo "ERROR: Found global React assignment!"
            exit 1
          fi
          
          if grep -r "global.React\s*=" dist/ 2>/dev/null; then
            echo "ERROR: Found global.React assignment!"
            exit 1
          fi
          
          echo "✅ No global React exposure detected"
          
          # Verify code splitting is working (multiple route chunks)
          route_chunks=$(ls dist/assets/ | grep -E "(Leases|Properties|Tenants|Maintenance)" | wc -l)
          if [ "$route_chunks" -lt 4 ]; then
            echo "WARNING: Expected at least 4 route chunks, found $route_chunks"
          else
            echo "✅ Code splitting working: $route_chunks route chunks found"
          fi
      
      - name: Generate Test Coverage
        run: npm run test:coverage
        continue-on-error: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landlord-frontend-test-results
          path: |
            Frontend/coverage/
            Frontend/dist/
