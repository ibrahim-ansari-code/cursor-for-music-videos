name: Deploy Brikli Frontend (Production)

on:
  push:
    branches:
      - main # Trigger on push to main
#  pull_request:
#    types: [opened, synchronize, reopened, closed]
#    branches:
#      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Build and Deploy Production Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true # Checkout submodules if needed
          lfs: false

      # Deploy Step using Deployment Token
      - name: Build And Deploy Production
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Explicitly set the deployment token secret for production
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PRODUCTION }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "Frontend" # App source code path (relative to root)
          api_location: "" # No API
          output_location: "dist" # Output location within app_location after build
          # Ensure build command installs deps and runs the build script from package.json
          app_build_command: "npm install && npm run build"
          # skip_api_build: true # Assuming no API
          ###### End of Repository/Build Configurations ######

# Removed PR-related steps as triggers are only on push
# Removed OIDC steps as deployment token is used
