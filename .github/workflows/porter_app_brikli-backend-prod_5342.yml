"on":
    push:
        branches:
            - main
name: Deploy to brikli-backend-prod
jobs:
    porter-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set Github tag
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            - name: Setup porter
              uses: porter-dev/setup-porter@v0.1.0
            - name: Deploy stack
              timeout-minutes: 30
              run: exec porter apply -f ./Backend/porter.yaml
              env:
                PORTER_APP_NAME: brikli-backend-prod
                PORTER_CLUSTER: "5342"
                PORTER_DEPLOYMENT_TARGET_ID: 4b8525cb-ace1-436f-b906-507600c2d021
                PORTER_HOST: https://dashboard.porter.run
                PORTER_PR_NUMBER: ${{ github.event.number }}
                PORTER_PROJECT: "15766"
                PORTER_REPO_NAME: ${{ github.event.repository.name }}
                PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
                PORTER_TOKEN: ${{ secrets.PORTER_APP_15766_5342 }}
